<!-- Supabase → Authentication → Emails → "Magic Link" AND "Confirm signup".
     Subject suggestion: "{{ .Token }} is your vouch code" -->
<div style="background:#09090b;padding:40px 24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#ffffff;text-align:center">
  <div style="display:inline-block;background:#d4ff3a;color:#09090b;border-radius:14px;width:48px;height:48px;line-height:48px;font-size:28px;font-weight:900">✓</div>
  <h1 style="font-size:24px;font-weight:900;margin:20px 0 8px">Your vouch code</h1>
  <p style="color:#8b8b97;margin:0 0 24px">Type this in the app to log in. It expires in 1 hour.</p>
  <div style="display:inline-block;background:#131316;border:1px solid #27272e;border-radius:16px;padding:16px 28px;font-size:36px;font-weight:900;letter-spacing:8px;color:#d4ff3a">{{ .Token }}</div>
  <p style="margin:28px 0 0">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/vote"
       style="display:inline-block;background:#d4ff3a;color:#09090b;text-decoration:none;font-weight:800;border-radius:14px;padding:14px 28px">
      Or tap to log in
    </a>
  </p>
  <p style="color:#8b8b97;font-size:12px;margin-top:32px">Didn’t request this? You can ignore this email.</p>
</div>
